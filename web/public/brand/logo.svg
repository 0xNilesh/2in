<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="2 embedding in logomark">
  <title>2in — "in" embedded inside the "2"</title>
  <!-- bold geometric "2" stroke -->
  <path d="M 50 90
           Q 50 30, 128 30
           Q 206 30, 206 92
           Q 206 130, 162 162
           L 60 222
           L 215 222"
        fill="none" stroke="#ff8a5b" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "in" tucked inside the upper inner curve of the "2" -->
  <text x="135" y="118"
        font-family="Geist, ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-weight="500" font-size="46" fill="#5eead4" font-style="italic"
        text-anchor="middle" letter-spacing="-1">in</text>
</svg>
