[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
galileo = "${GALILEO_RPC}"
aristotle = "${ARISTOTLE_RPC}"

[etherscan]
galileo = { key = "verifier-not-required", url = "${GALILEO_EXPLORER_API}" }

# See https://book.getfoundry.sh/reference/config.html for full options.
